[package]
name = "solidcraft-android"
description = "SolidCraft on Android: eframe + wgpu shell on GameActivity, reusing the desktop engine and egui UI"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# The workspace forbids `unsafe`; the Android entry point needs `#[unsafe(no_mangle)]` and the SAF
# bridge needs JNI, so this crate follows the `crates/platform` precedent: `deny`, with
# `#[allow(unsafe_code)]` on those functions only. Deliberately NOT `[lints] workspace = true`,
# which would bring back `forbid`.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"
neg_cmp_op_on_partial_ord = "allow"

[lib]
name = "main"
crate-type = ["cdylib"]

[target.'cfg(target_os = "android")'.dependencies]
# The same engine the desktop app builds, with the same default feature pair
# (`apps/solidcraft` enables both on its own `solidcraft-engine` dependency):
#   bundled-render-library — the authored texture/HDR pack the Render workspace lists
#   raytrace-cpu           — the CPU raytracer behind Render workspace shots
solidcraft-engine = { workspace = true, features = ["bundled-render-library", "raytrace-cpu"] }
solidcraft-ui-egui = { workspace = true }
egui = { workspace = true }
log = { workspace = true }
# accesskit + native-activity is a hard `compile_error!` in eframe, and NativeActivity has no soft
# keyboard/IME, so a CAD app with dialog fields and a command palette must use GameActivity.
# `persistence` comes in through the workspace declaration; the shell stores its own prefs file
# instead of eframe's app.ron (see `load_prefs`/`save_prefs`).
eframe = { workspace = true, default-features = false, features = [
    "default_fonts",
    "wgpu",
    "android-game-activity",
] }
winit = { version = "0.30", default-features = false }
android_logger = "0.15"
# The device's CJK face is vetted before it is installed: a face that parses can still lack the
# glyphs (a Korean-only CJK face), and a box glyph is what this check exists to prevent.
ttf-parser = { workspace = true }
# The Storage Access Framework bridge (src/saf.rs).
jni = "0.22"
ndk-context = "0.1"
